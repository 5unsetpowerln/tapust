[package]
name = "tapust"
description = "A fast Wayland terminal emulator with a built-in tmux-compatible multiplexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
term = { package = "tapust-term", path = "../term" }
mux = { package = "tapust-mux", path = "../mux" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
glow = "0.16"
crossfont = "0.8"
libc = "0.2"
parking_lot = "0.12"
