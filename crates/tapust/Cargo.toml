[package]
name = "tapust"
description = "A fast Wayland terminal emulator with a built-in tmux-compatible multiplexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
term = { package = "tapust-term", path = "../term" }
mux = { package = "tapust-mux", path = "../mux" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_8"] }
glow = "0.16"
crossfont = "0.8"
libc = "0.2"
parking_lot = "0.12"
